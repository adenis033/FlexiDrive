version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - flexidrive-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1. User Service
  user-service:
    build: ./userservice
    container_name: user-service
    ports:
      - "8081:8081"
    networks:
      - flexidrive-network

  # 2. Fleet Service
  fleet-service:
    build: ./fleetservice
    container_name: fleet-service
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - flexidrive-network

  # 3. Booking Service
  booking-service:
    build: ./bookingservice
    container_name: booking-service
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      fleet-service:
        condition: service_started
    environment:
      # Service URLs
      - USER_SERVICE_URL=http://user-service:8081/api/users/
      - FLEET_SERVICE_URL=http://fleet-service:8082/api/vehicles/
      # RabbitMQ Configuration
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - flexidrive-network

networks:
  flexidrive-network:
    driver: bridge